version: "3.8"

services:
  huobao-drama-p:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huobao-drama-p
    ports:
      - "3003:5678"
    volumes:
      - /vol1/1000/docker/huobao-drama-p/data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
